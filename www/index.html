<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C HTTP Server</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 700px;
        }
        h1 {
            font-size: 3.2rem;
            margin: 0 0 15px 0;
        }
        p {
            font-size: 1.25rem;
            line-height: 1.6;
            margin: 15px 0 30px 0;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            margin: 10px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 C HTTP Server</h1>
        <p><strong>Running Successfully!!</strong></p>
        <p>This beautiful webpage is being served by our own HTTP Server written in C.</p>
        <a href="/about.html" class="btn">About This Project</a>
